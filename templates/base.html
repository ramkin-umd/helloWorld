<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Jinja block for the page title -->
    <title>{% block page_title %}{% endblock %}</title>

    <!-- Bootstrap CSS Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- A clean navigation/header bar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Ashwin Ramkumar's Flask App</span>
        </div>
    </nav>

    <div class="container">
        <!-- Jinja block for the main header -->
        <h1 class="mb-4 text-primary">{% block page_head %}{% endblock %}</h1>

        <!-- Jinja block for the specific page content -->
        <div class="card shadow-sm p-4 mb-5 bg-white rounded">
            {% block page_content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
